name: Generate profile

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
    - main
    paths-ignore:
      - 'assets/**'

concurrency:
  group: profile-output
  cancel-in-progress: false

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: generate snake.svg
        uses: ArthurLobopro/snk/svg-only@v0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?hide_stack=true
            dist/github-snake-dark.svg?palette=github-dark&hide_stack=true
    
      - name: Validate Codex account usage handling
        run: python scripts/test_codex_usage.py

      - name: Generate and validate profile SVGs
        run: python scripts/generate-profile.py --snakes dist --output assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update profile assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/profile-light.svg assets/profile-dark.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh profile assets"
            git push
          fi

      - name: Publish snake SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

